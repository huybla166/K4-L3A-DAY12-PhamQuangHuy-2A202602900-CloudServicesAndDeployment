# CI/CD: mỗi lần push/PR vào main → chạy test + build image trên máy sạch của GitHub.
# Chỉ khi cả hai xanh VÀ là push lên main thì mới deploy lên Render (qua Deploy Hook).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # URL công khai của service — không phải bí mật nên để thẳng ở đây
  PUBLIC_URL: https://day12-agent-zj8e.onrender.com

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        # Máy CI không có .env → truyền config qua biến môi trường (12-Factor, CP1)
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        # Bỏ test_cp5 (cần bản deploy đang sống) và test_bonus_cicd (tự kiểm tra badge của chính workflow này);
        # test build Docker (mark `docker`) để job build lo
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Image size
        run: docker images day12-agent:${{ github.sha }} --format "{{.Repository}}:{{.Tag}} {{.Size}}"

      - name: Smoke test container
        # Chạy thử image vừa build: bắt lỗi kiểu "file chỉ có trên máy tôi" hoặc .dockerignore loại nhầm
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Chưa tạo secret RENDER_DEPLOY_HOOK_URL (repo → Settings → Secrets and variables → Actions)"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke test after deploy
        # Deploy hook trả về ngay; chờ bản mới lên rồi kiểm tra liveness + readiness trên URL thật
        run: |
          sleep 60
          for i in $(seq 1 10); do
            if curl -fsS --max-time 90 "$PUBLIC_URL/health" && curl -fsS --max-time 30 "$PUBLIC_URL/ready"; then
              echo; echo "Service healthy at $PUBLIC_URL"; exit 0
            fi
            sleep 15
          done
          exit 1
